services:
  experimento:
    image: epidemias-gnn:gpu
    build:
      target: gpu
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/cu121
        DGL_VERSION: "2.1.0+cu121"
        DGL_WHEELS: https://data.dgl.ai/wheels/cu121/repo.html
    environment:
      DEVICE: cuda
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
